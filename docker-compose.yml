services:
  postgres:
    image: postgres:17-alpine
    container_name: automotive-craft-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: automotive_craft
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d automotive_craft']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
